name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # requirements.txt holds runtime deps (mcp, playwright, aiohttp, ...).
        # pytest + pytest-asyncio are the test toolchain and are NOT pinned in
        # requirements.txt, so install them explicitly. The suite is pure mocks
        # (no network, no browser), so `playwright install` is intentionally
        # skipped — only the playwright *package* import needs to resolve.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run mocked test suite
        # pytest.ini sets `addopts = -m "not e2e"`, so the live e2e smoke tests
        # (tests/test_e2e_smoke.py, marked @pytest.mark.e2e) stay excluded and
        # nothing touches Naukri or the network. `git` is preinstalled on the
        # runner, which the healing snapshot tests shell out to.
        run: pytest
